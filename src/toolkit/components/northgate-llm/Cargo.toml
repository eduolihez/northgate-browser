[package]
name = "northgate_llm"
version = "0.1.0"
authors = ["The NorthGate Project"]
edition = "2021"
license = "MPL-2.0"
description = "On-device LLM explanation service exposed as an XPCOM service."

[dependencies]
xpcom = { path = "../../../xpcom/rust/xpcom" }
nserror = { path = "../../../xpcom/rust/nserror" }
nsstring = { path = "../../../xpcom/rust/nsstring" }
moz_task = { path = "../../../xpcom/rust/moz_task" }
cstr = "0.2"
thin-vec = { version = "0.2.1", features = ["gecko-ffi"] }

northgate_llm_prompt = { path = "../northgate-llm-prompt" }

# Pinned to the exact version verified against `vendor/llama.cpp`'s pinned
# tag (v0.5.0) while writing engine.rs -- see build.rs and Task 8's report
# for what could/couldn't be verified about this dependency's own build.
# `default-features = false` to skip the `openmp`, `android-shared-stdlib`
# and `common` (~14 MB JSON-schema-to-grammar helper library) defaults,
# none of which this CPU-only, plain-text-generation use case needs.
llama-cpp-2 = { version = "=0.1.158", default-features = false }

[lib]
path = "src/lib.rs"
