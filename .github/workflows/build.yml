# NorthGate Browser — build & release (Linux, Windows, macOS)
#
# Builds NorthGate on every push to `main` and on manual dispatch, and publishes
# the packaged builds to a GitHub Release when a `v*` tag is pushed.
#
# The browser source lives in `src/`, so every mach command runs there.
#
# IMPORTANT — resource reality:
#   * A full Firefox/NorthGate build needs tens of GB of disk, multi-GB RAM and
#     1-3 h. GitHub-hosted runners are tight on disk, so the reclaim step below
#     is required. Linux is the most likely to complete on the free tier; macOS
#     runners are disk-constrained and Windows may need extra toolchain setup.
#     For reliable full builds, use a larger or self-hosted runner.
#   * Private-repo minutes bill with multipliers (Windows 2x, macOS 10x).
#   * Point MOZCONFIG at your NorthGate branding mozconfig before shipping.

name: Build NorthGate

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create Releases and upload assets

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows-only on this branch: Linux/macOS hosted runners hit
          # disk/memory and timeout limits. Restore the full matrix on main.
          - name: windows
            runner: windows-latest
            artifact: northgate-windows

    defaults:
      run:
        # A job-level defaults.run block does not inherit the workflow-level
        # `shell: bash`, so it must be repeated here or Windows falls back to
        # PowerShell and the bash heredoc in "Write CI mozconfig" fails.
        shell: bash
        working-directory: src

    steps:
      - name: Reclaim runner disk space (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Cache the mozbuild toolchain (clang, rust, etc.) fetched by bootstrap so
      # reruns skip the multi-GB download.
      - name: Cache mozbuild toolchain
        uses: actions/cache@v6
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-${{ hashFiles('src/python/mozboot/**') }}
          restore-keys: |
            mozbuild-${{ runner.os }}-

      # Firefox/NorthGate's mach requires MozillaBuild (MSYS + build tools) on
      # Windows; the hosted runner does not ship it, so mach aborts at startup.
      - name: Install MozillaBuild (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mozbuildsetup.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\mozbuildsetup.exe" -ArgumentList "/S" -Wait
          "MOZILLABUILD=C:\mozilla-build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap build dependencies
        # mach auto-detects the non-interactive CI shell (no TTY), so no prompt.
        run: python mach bootstrap --application-choice browser

      - name: Write CI mozconfig
        run: |
          # Source the project's own NorthGate config (which sources
          # base-browser), then add what a local/CI build requires. Base Browser
          # mandates --with-base-browser-version, so a bare mozconfig fails at
          # configure.
          cat > mozconfig <<'EOF'
          . $topsrcdir/browser/config/mozconfigs/northgate-browser

          ac_add_options --with-base-browser-version=dev-build
          ac_add_options --enable-update-channel=default
          ac_add_options --with-branding=browser/branding/mb-alpha
          ac_add_options --disable-minify

          # base-browser enables cross-LTO, which is too heavy for hosted
          # runners; disable it so CI builds fit within time/memory limits.
          ac_add_options --disable-lto
          EOF
          echo "MOZCONFIG=${{ github.workspace }}/src/mozconfig" >> "$GITHUB_ENV"

      - name: Build
        run: python mach build

      - name: Package
        run: python mach package

      - name: Collect artifacts
        working-directory: .
        run: |
          # base-browser's objdir is obj-<config-guess>, so glob for it.
          mkdir -p dist-out
          shopt -s nullglob
          for f in src/obj-*/dist/*.tar.* src/obj-*/dist/*.zip \
                   src/obj-*/dist/*.dmg src/obj-*/dist/*.exe; do
            cp "$f" dist-out/
          done
          ls -la dist-out

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist-out/*
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-out/*
          generate_release_notes: true
