# NorthGate Browser — build & release (Linux, Windows, macOS)
#
# Builds NorthGate on every push to `main` and on manual dispatch, and publishes
# the packaged builds to a GitHub Release when a `v*` tag is pushed.
#
# The browser source lives in `src/`, so every mach command runs there.
#
# IMPORTANT — read before relying on this:
#   * Building Firefox/NorthGate is heavy: tens of GB of disk, multi-GB RAM,
#     and typically 1-3 h. GitHub-hosted runners are tight on disk (~14 GB) and
#     cap jobs at 6 h, so a large or self-hosted runner is strongly recommended.
#   * Windows especially usually needs the MozillaBuild environment; the vanilla
#     runner here is best-effort and may require extra setup to complete.
#   * Private-repo minutes are billed with multipliers (Windows 2x, macOS 10x) —
#     enable only the platforms you actually need to avoid burning your quota.
#   * Point MOZCONFIG at your NorthGate branding mozconfig before shipping.

name: Build NorthGate

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create Releases and upload assets

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            artifact: northgate-linux
          - name: windows
            runner: windows-latest
            artifact: northgate-windows
          - name: macos
            runner: macos-latest
            artifact: northgate-macos
    defaults:
      run:
        working-directory: src

    steps:
      - name: Reclaim runner disk space (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap build dependencies
        run: python mach --no-interactive bootstrap --application-choice browser

      - name: Write CI mozconfig
        run: |
          cat > mozconfig <<'EOF'
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          # Point this at your NorthGate branding, e.g.:
          # ac_add_options --with-branding=browser/branding/mb-release
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-build
          EOF
          echo "MOZCONFIG=${{ github.workspace }}/src/mozconfig" >> "$GITHUB_ENV"

      - name: Build
        run: python mach build

      - name: Package
        run: python mach package

      - name: Collect artifacts
        working-directory: .
        run: |
          mkdir -p dist-out
          find src/obj-build/dist -maxdepth 1 -type f \
            \( -name '*.tar.*' -o -name '*.zip' -o -name '*.dmg' -o -name '*.exe' \) \
            -exec cp {} dist-out/ \; || true
          ls -la dist-out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-out/*
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-out/*
          generate_release_notes: true
