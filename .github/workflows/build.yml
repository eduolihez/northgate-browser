# NorthGate Browser — build & release
#
# Builds NorthGate on every push to `main` and on manual dispatch, and publishes
# the packaged build to a GitHub Release when a `v*` tag is pushed.
#
# IMPORTANT: building Firefox/NorthGate is resource-heavy (tens of GB of disk,
# multi-GB RAM, and typically 1-3 h). GitHub-hosted runners are tight on disk
# (~14 GB) and cap jobs at 6 h, so the free-disk-space step below is required and
# a large or self-hosted runner is strongly recommended for reliable full builds.
# Point MOZCONFIG at your NorthGate branding mozconfig before relying on releases.

name: Build NorthGate

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create Releases and upload assets

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap build dependencies
        run: |
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Write CI mozconfig
        run: |
          cat > mozconfig <<'EOF'
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          # Point this at your NorthGate branding, e.g.:
          # ac_add_options --with-branding=browser/branding/mb-release
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-build
          EOF
          echo "MOZCONFIG=$PWD/mozconfig" >> "$GITHUB_ENV"

      - name: Build
        run: ./mach build

      - name: Package
        run: ./mach package

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p dist-out
          find obj-build/dist -maxdepth 1 -type f \
            \( -name '*.tar.*' -o -name '*.zip' \) -exec cp {} dist-out/ \;
          ls -la dist-out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: northgate-linux
          path: dist-out/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-out/*
          generate_release_notes: true
