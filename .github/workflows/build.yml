# NorthGate Browser — build & release (Linux, Windows, macOS)
#
# Builds NorthGate on every push to `main` and on manual dispatch, and publishes
# the packaged builds to a GitHub Release when a `v*` tag is pushed.
#
# The browser source lives in `src/`, so every mach command runs there.
#
# IMPORTANT — resource reality:
#   * A full Firefox/NorthGate build needs tens of GB of disk, multi-GB RAM and
#     1-3 h. GitHub-hosted runners are tight on disk, so the reclaim step below
#     is required. Linux is the most likely to complete on the free tier; macOS
#     runners are disk-constrained and Windows may need extra toolchain setup.
#     For reliable full builds, use a larger or self-hosted runner.
#   * Private-repo minutes bill with multipliers (Windows 2x, macOS 10x).
#   * Point MOZCONFIG at your NorthGate branding mozconfig before shipping.

name: Build NorthGate

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create Releases and upload assets

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            artifact: northgate-linux
          - name: windows
            runner: windows-latest
            artifact: northgate-windows
          - name: macos
            runner: macos-latest
            artifact: northgate-macos

    defaults:
      run:
        working-directory: src

    steps:
      - name: Reclaim runner disk space (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache the mozbuild toolchain (clang, rust, etc.) fetched by bootstrap so
      # reruns skip the multi-GB download.
      - name: Cache mozbuild toolchain
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-${{ hashFiles('src/python/mozboot/**') }}
          restore-keys: |
            mozbuild-${{ runner.os }}-

      - name: Bootstrap build dependencies
        # mach auto-detects the non-interactive CI shell (no TTY), so no prompt.
        run: python mach bootstrap --application-choice browser

      - name: Write CI mozconfig
        run: |
          cat > mozconfig <<'EOF'
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --enable-strip
          # Point this at your NorthGate branding, e.g.:
          # ac_add_options --with-branding=browser/branding/mb-release
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-build
          EOF
          echo "MOZCONFIG=${{ github.workspace }}/src/mozconfig" >> "$GITHUB_ENV"

      - name: Build
        run: python mach build

      - name: Package
        run: python mach package

      - name: Collect artifacts
        working-directory: .
        run: |
          mkdir -p dist-out
          find src/obj-build/dist -maxdepth 1 -type f \
            \( -name '*.tar.*' -o -name '*.zip' -o -name '*.dmg' -o -name '*.exe' \) \
            -exec cp {} dist-out/ \; || true
          ls -la dist-out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-out/*
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-out/*
          generate_release_notes: true
